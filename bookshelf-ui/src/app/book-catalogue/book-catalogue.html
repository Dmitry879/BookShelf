<div class="container mt-4">

  <h2>Book Catalogue</h2>

  <div class="d-flex justify-content-end align-items-center gap-2 mt-3">

    <label for="viewMode" class="form-label mb-0">
      Display View:
    </label>

    <select
      class="form-select w-auto"
      [value]="viewMode"
      (change)="onViewModeChange($event)">
      <option value="grid">Grid</option>
      <option value="list">List</option>
    </select>

  </div>

  <ul class="list-group mt-3" *ngIf="viewMode === 'list'">

    <li class="list-group-item" *ngFor="let book of books">
      <strong>
        <a [routerLink]="['/books', book.id]">{{ book.title }}</a>
      </strong>
      by
      <span *ngFor="let author of book.authors; let last = last">
        {{ author.name }}{{ !last ? ', ' : '' }}
      </span>
    </li>

  </ul>

  <div class="row g-4 mt-3" *ngIf="viewMode === 'grid'">

    <div
      class="col-6 col-md-4 col-lg-3 col-xl-2"
      *ngFor="let book of books">
      <app-book-card [book]="book"></app-book-card>
    </div>

  </div>

</div>
